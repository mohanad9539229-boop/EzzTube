<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>عز تيوب</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0c0a09; font-family: sans-serif; }

    /* شريط العنوان العلوي */
    .header-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 20px;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(8px);
      color: #990000; /* أحمر غامق */
      font-size: 24px;
      font-weight: bold;
      z-index: 10;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #800000;
    }

    /* فيديو الخلفية Full Screen */
    .fullscreen-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .fullscreen-bg iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      transform: scale(1.35);
    }
  </style>
</head>
<body>

  <div class="header-bar">
    📺 عز تيوب
  </div>

  <div class="fullscreen-bg">
    <iframe 
      src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1&mute=1&loop=1&playlist=VIDEO_ID&controls=0" 
      allow="autoplay; encrypted-media" 
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
