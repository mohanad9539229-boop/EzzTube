<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عز تيوب</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* الهيدر العلوي */
    .header-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 24px;
      background: rgba(10, 10, 10, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #dc2626;
      font-size: 22px;
      font-weight: 800;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(220, 38, 38, 0.2);
    }

    /* حاوي الفيديو Fullscreen */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: auto; /* يمكن تغييره لـ none إذا كنت لا تريد التفاعل مع الفيديو */
    }

    .video-background iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      /* تكبير لضمان تغطية الحواف السوداء */
      transform: scale(1.35);
      transform-origin: center center;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    📺 <span>عز تيوب</span>
  </div>

  <div class="video-background">
    <iframe 
      src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&loop=1&playlist=dQw4w9WgXcQ&controls=0&rel=0&enablejsapi=1" 
      title="عز تيوب" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
