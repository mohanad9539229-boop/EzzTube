<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عز تيوب - EzzTube</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* الهيدر العلوي */
    header {
      position: sticky;
      top: 0;
      height: 60px;
      background: rgba(15, 15, 15, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid rgba(220, 38, 38, 0.2);
      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #dc2626;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .search-box {
      display: flex;
      align-items: center;
      width: 40%;
      max-width: 500px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 16px;
      border-radius: 20px 0 0 20px;
      border: 1px solid #333;
      background: #121212;
      color: #fff;
      outline: none;
    }

    .search-box button {
      padding: 8px 16px;
      border-radius: 0 20px 20px 0;
      border: 1px solid #333;
      border-right: none;
      background: #222;
      color: #fff;
      cursor: pointer;
    }

    /* التنسيق الرئيسي */
    .main-container {
      display: flex;
      flex: 1;
    }

    /* القائمة الجانبية */
    aside {
      width: 200px;
      background: #0f0f0f;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-left: 1px solid #222;
    }

    .side-item {
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      color: #aaa;
      transition: 0.2s;
      font-size: 14px;
    }

    .side-item:hover, .side-item.active {
      background: #272727;
      color: #fff;
    }

    /* منطقة المحتوى والفيديوهات */
    main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* مشغل الفيديو الرئيسي */
    .player-wrapper {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .player-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 ratio */
      height: 0;
    }

    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* شبكة الكروت (Grid) */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #181818;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .video-card:hover {
      transform: translateY(-4px);
      background: #222;
    }

    .thumbnail {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: #282828;
    }

    .video-info {
      padding: 12px;
    }

    .video-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-meta {
      font-size: 12px;
      color: #aaa;
    }

    @media (max-width: 768px) {
      aside { display: none; }
      .search-box { width: 60%; }
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header>
    <div class="logo">
      <span>📺</span> عز تيوب
    </div>
    <div class="search-box">
      <input type="text" placeholder="بحث...">
      <button>🔍</button>
    </div>
  </header>

  <div class="main-container">
    <!-- القائمة الجانبية -->
    <aside>
      <div class="side-item active">🏠 الرئيسية</div>
      <div class="side-item">🔥 الشائع</div>
      <div class="side-item">📁 الاشتراكات</div>
      <div class="side-item">📚 المكتبة</div>
    </aside>

    <!-- المحتوى والمشغل -->
    <main>
      <!-- مشغل الفيديو العلوي -->
      <div class="player-wrapper">
        <div class="player-container">
          <iframe 
            id="mainPlayer"
            src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=0&rel=0" 
            title="عز تيوب" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
      </div>

      <h2 style="font-size: 18px; color: #fff;">مقترحات لك</h2>

      <!-- شبكة الفيديوهات -->
      <div class="video-grid">
        
        <div class="video-card" onclick="changeVideo('dQw4w9WgXcQ')">
          <img class="thumbnail" src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="Video 1">
          <div class="video-info">
            <div class="video-title">فيديو 1 - عنوان الفيديو المقترح</div>
            <div class="video-meta">عز تيوب • 100 ألف مشاهدة</div>
          </div>
        </div>

        <div class="video-card" onclick="changeVideo('5qap5aO4i9A')">
          <img class="thumbnail" src="https://img.youtube.com/vi/5qap5aO4i9A/hqdefault.jpg" alt="Video 2">
          <div class="video-info">
            <div class="video-title">فيديو 2 - موسيقى هادئة وخلفيات</div>
            <div class="video-meta">عز تيوب • 50 ألف مشاهدة</div>
          </div>
        </div>

        <div class="video-card" onclick="changeVideo('LXb3EKWsInQ')">
          <img class="thumbnail" src="https://img.youtube.com/vi/LXb3EKWsInQ/hqdefault.jpg" alt="Video 3">
          <div class="video-info">
            <div class="video-title">فيديو 3 - طبيعة وتجربة عرض 4K</div>
            <div class="video-meta">عز تيوب • 1M مشاهدة</div>
          </div>
        </div>

        <div class="video-card" onclick="changeVideo('jNQXAC9IVRw')">
          <img class="thumbnail" src="https://img.youtube.com/vi/jNQXAC9IVRw/hqdefault.jpg" alt="Video 4">
          <div class="video-info">
            <div class="video-title">فيديو 4 - أول فيديو على يوتيوب</div>
            <div class="video-meta">عز تيوب • 200M مشاهدة</div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    // وظيفة تغيير الفيديو عند الضغط على أي كارت
    function changeVideo(videoId) {
      const player = document.getElementById('mainPlayer');
      player.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
